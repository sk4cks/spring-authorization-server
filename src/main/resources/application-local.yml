# 맥 로컬 개발 — Docker Compose Postgres + 로컬 Mailcow
# Postgres: docker compose up -d  (user/db = note/notedb, 비번은 .env / launch.json)
# 비밀값: .vscode/launch.json (SPRING_DATASOURCE_PASSWORD, MAILBOX_*, MAILCOW_API_KEY)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notedb
    username: note
    password: ${SPRING_DATASOURCE_PASSWORD:}

app:
  mail:
    domain: note.local
    mailbox-secret: ${MAILBOX_PASSWORD_SECRET:}
    mailbox-salt: ${MAILBOX_PASSWORD_SALT:}
    mailcow:
      enabled: true
      base-url: https://127.0.0.1:8443
      api-key: ${MAILCOW_API_KEY:}
      imap-host: 127.0.0.1
      imap-port: 993
      smtp-host: 127.0.0.1
      smtp-port: 587
