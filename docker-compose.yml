# 로컬 Auth 개발용 Postgres (서울 EC2 DB와 분리)
# 기동: docker compose up -d   (.env 에 POSTGRES_PASSWORD 필요 — .env.example 참고)
# 중지: docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: note-postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: note
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notedb
    volumes:
      - note-postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U note -d notedb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  note-postgres-local-data:
